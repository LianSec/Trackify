<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trackify</title>
<meta name="description" content="Habit Tracker mit Monk Mode, Meditation, Breathwork und Trainingslog.">
<meta name="theme-color" content="#2c4a92">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23d2432f'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' fill='none' stroke='%23fff4ea' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Shippori+Mincho:wght@600;800&display=swap">
</head>
<body>
<header class="bar"><div class="bar-in">
  <div class="brand">Trackify <small>日課</small></div>
  <span class="save num" id="save"></span>
  <a class="account" id="account" href="#konto" hidden></a>
  <nav class="tabs" aria-label="Bereiche">
    <a href="#heute" data-v="heute">Heute</a>
    <a href="#ruhe" data-v="ruhe">Meditation</a>
    <a href="#training" data-v="training">Training</a>
    <a href="#statistik" data-v="statistik">Statistik</a>
    <a href="#gewohnheiten" data-v="gewohnheiten">Gewohnheiten</a>
  </nav>
</div></header>
<main class="wrap">
  <div id="banner"></div>
  <section class="view" id="view"><div class="card empty"><p class="muted">Wird geladen…</p></div></section>
</main>
<div class="sess" id="session" hidden role="dialog" aria-modal="true" aria-label="Übung läuft"></div>
<a class="sosfab" id="sosfab" href="#sos" aria-label="Drang-Hilfe öffnen">Drang? <b>SOS</b></a>
<div class="toast" id="toast" hidden></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
